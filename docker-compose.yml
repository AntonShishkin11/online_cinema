networks:
  backend:

volumes:
  db_auth_data:
  db_admin_data:
  db_payments_data:

services:
  # --------------------- Databases ---------------------
  db_auth:
    image: postgres:15
    container_name: db_auth
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_AUTH_SERVICE}
      POSTGRES_USER: ${POSTGRES_USER_AUTH_SERVICE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH_SERVICE}
    ports:
      - "${POSTGRES_PORT_AUTH_SERVICE}:5432"
    volumes:
      - db_auth_data:/var/lib/postgresql/data
    networks: [backend]

  db_admin:
    image: postgres:15
    container_name: db_admin
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_ADMIN_SERVICE}
      POSTGRES_USER: ${POSTGRES_USER_ADMIN_SERVICE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ADMIN_SERVICE}
    ports:
      - "${POSTGRES_PORT_ADMIN_SERVICE}:5432"
    volumes:
      - db_admin_data:/var/lib/postgresql/data
    networks: [backend]

  db_payments:
    image: postgres:15
    container_name: db_payments
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PAYMENTS}
      POSTGRES_USER: ${POSTGRES_USER_PAYMENTS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PAYMENTS}
    ports:
      - "${POSTGRES_PORT_PAYMENTS}:5432"
    volumes:
      - db_payments_data:/var/lib/postgresql/data
    networks: [backend]

  # --------------------- Infra ---------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports: ["6379:6379"]
    networks: [backend]


  # --------------------- Backend services ---------------------
  auth_service:
    build: ./services/auth_service
    container_name: auth_service
    restart: unless-stopped
    env_file:
      - .env
      - ./services/auth_service/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER_AUTH_SERVICE}:${POSTGRES_PASSWORD_AUTH_SERVICE}@db_auth:5432/${POSTGRES_DB_AUTH_SERVICE}"
    depends_on: [db_auth, redis]
    ports: ["8001:8000"]
    networks: [backend]

  admin_service:
    build: ./services/admin_service
    container_name: admin_service
    restart: unless-stopped
    env_file:
      - .env
      - ./services/admin_service/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER_ADMIN_SERVICE}:${POSTGRES_PASSWORD_ADMIN_SERVICE}@db_admin:5432/${POSTGRES_DB_ADMIN_SERVICE}"
    depends_on: [db_admin]
    ports: ["8002:8000"]
    networks: [backend]

  content_service:
    build: ./services/content_service
    container_name: content_service
    restart: unless-stopped
    env_file:
      - .env
      - ./services/content_service/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER_ADMIN_SERVICE}:${POSTGRES_PASSWORD_ADMIN_SERVICE}@db_admin:5432/${POSTGRES_DB_ADMIN_SERVICE}"
    depends_on: [db_admin]
    ports: ["8003:8000"]
    networks: [backend]

  file_service:
    build: ./services/file_service
    container_name: file_service
    restart: unless-stopped
    env_file:
      - .env
      - ./services/file_service/.env
    depends_on: [db_admin]
    ports: ["8004:8000"]
    networks: [backend]

  subscription_service:
    build: ./services/subscription_service
    container_name: subscription_service
    restart: unless-stopped
    env_file:
      - .env
      - ./services/subscription_service/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER_ADMIN_SERVICE}:${POSTGRES_PASSWORD_ADMIN_SERVICE}@db_admin:5432/${POSTGRES_DB_ADMIN_SERVICE}"
    depends_on: [db_admin]
    ports: ["8005:8000"]
    networks: [backend]

  payment_service:
    build: ./services/payment_service
    container_name: payment_service
    restart: unless-stopped
    env_file:
      - .env
      - ./services/payment_service/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER_PAYMENTS}:${POSTGRES_PASSWORD_PAYMENTS}@db_payments:5432/${POSTGRES_DB_PAYMENTS}"
      SYNC_DATABASE_URL: "postgresql://${POSTGRES_USER_PAYMENTS}:${POSTGRES_PASSWORD_PAYMENTS}@db_payments:5432/${POSTGRES_DB_PAYMENTS}"
    depends_on: [db_payments, subscription_service]
    ports: ["8006:8000"]
    networks: [backend]

  email_worker:
    build: ./services/email_service
    container_name: email_worker
    restart: unless-stopped
    env_file:
      - .env
      - ./services/email_service/.env
    depends_on: [redis]
    # Use the same command as in Dockerfile (or omit entirely to use CMD)
    command: ["celery", "-A", "app.worker_main:celery_app", "worker", "--loglevel=info", "-Q", "emails"]
    networks: [backend]


  # --------------------- API Gateway (nginx) ---------------------
  gateway:
    image: nginx:1.25-alpine
    container_name: gateway
    restart: unless-stopped
    depends_on:
      - auth_service
      - admin_service
      - content_service
      - file_service
      - subscription_service
      - payment_service
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]
